backend:
  name: git-gateway
  branch: main
publish_mode: editorial_workflow

media_folder: "img/uploads"
public_folder: "/img/uploads"

locale: es

collections:
  # Servicios, Horarios, Autoridades, Preguntas frecuentes, Visitas y Transparencia se editan en el
  # Portal Funcionarios → Contenido del sitio (en vivo, sin regenerar el sitio).
  - name: "paginas"
    label: "Páginas del sitio"
    files:

      - label: "Quiénes Somos"
        name: "quienes_somos"
        file: "_data/quienes_somos.json"
        fields:
          - { label: "Misión", name: mision, widget: text }
          - { label: "Visión", name: vision, widget: text }
          - { label: "Historia del hospital", name: historia, widget: markdown }
          - { label: "Plan Estratégico", name: plan_estrategico, widget: markdown }

      - label: "Contacto"
        name: "contacto"
        file: "_data/contacto.json"
        fields:
          - { label: "Texto introductorio del formulario", name: intro, widget: text }
          - { label: "Horario OIRS", name: oirs_horario, widget: string, required: false }
          - { label: "Descripción OIRS", name: oirs_descripcion, widget: text }

      - label: "Carta de Derechos y Deberes"
        name: "carta_derechos"
        file: "_data/carta_derechos.json"
        fields:
          - { label: "Título", name: titulo, widget: string }
          - { label: "Introducción", name: intro, widget: text }
          - label: "Derechos del paciente"
            name: derechos
            widget: list
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Descripción", name: descripcion, widget: text }
          - label: "Deberes del paciente"
            name: deberes
            widget: list
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Descripción", name: descripcion, widget: text }
          - { label: "Descripción OIRS", name: oirs_descripcion, widget: text }

      - label: "Aranceles"
        name: "aranceles"
        file: "_data/aranceles.json"
        fields:
          - { label: "Título", name: titulo, widget: string }
          - { label: "Introducción", name: intro, widget: text }
          - { label: "Contenido", name: body, widget: markdown }

      - label: "Copago Cero"
        name: "copago_cero"
        file: "_data/copago_cero.json"
        fields:
          - { label: "Título", name: titulo, widget: string }
          - { label: "Introducción", name: intro, widget: text }
          - { label: "Contenido", name: body, widget: markdown }

      - label: "Ley Ricarte Soto"
        name: "ley_ricarte_soto"
        file: "_data/ley_ricarte_soto.json"
        fields:
          - { label: "Título", name: titulo, widget: string }
          - { label: "Introducción", name: intro, widget: text }
          - { label: "Contenido", name: body, widget: markdown }

      - label: "¿Dónde consultar?"
        name: "donde_consultar"
        file: "_data/donde_consultar.json"
        fields:
          - { label: "Título", name: titulo, widget: string }
          - { label: "Introducción", name: intro, widget: text }
          - label: "Opciones"
            name: opciones
            widget: list
            fields:
              - { label: "Id", name: id, widget: string }
              - { label: "Título", name: titulo, widget: string }
              - { label: "Qué hacer", name: accion, widget: string }
              - { label: "Ícono (Material Symbols)", name: icono, widget: string }
              - { label: "Color", name: tono, widget: select, options: ["rojo", "azul", "verde"] }
              - { label: "Ejemplos", name: ejemplos, widget: list, field: { label: "Ejemplo", name: texto, widget: string } }
          - label: "Categorización en Urgencia"
            name: categorizacion
            widget: object
            fields:
              - { label: "Introducción", name: intro, widget: markdown }
              - label: "Niveles"
                name: niveles
                widget: list
                fields:
                  - { label: "Nivel", name: nivel, widget: string }
                  - { label: "Nombre", name: nombre, widget: string }
                  - { label: "Espera", name: espera, widget: string }
              - { label: "Nota", name: nota, widget: text }

      - label: "Calidad (Portal Funcionarios)"
        name: "calidad"
        file: "_data/calidad.json"
        fields:
          - { label: "Título", name: titulo, widget: string }
          - { label: "Descripción", name: descripcion, widget: text }
          - { label: "Carpeta general (Drive)", name: carpetaGeneral, widget: string }
          - label: "Destacados"
            name: destacados
            widget: list
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Descripción", name: descripcion, widget: string }
              - { label: "Enlace", name: url, widget: string }
          - label: "Ámbitos de acreditación"
            name: ambitos
            widget: list
            fields:
              - { label: "Sigla", name: sigla, widget: string }
              - { label: "Nombre", name: nombre, widget: string }
              - { label: "Descripción", name: descripcion, widget: string }
              - { label: "Ícono", name: icono, widget: string }
              - { label: "Carpeta (Drive)", name: url, widget: string, required: false }
              - { label: "Documentos", name: documentos, widget: list, required: false, fields: [{ label: "Título", name: titulo, widget: string }, { label: "Código", name: codigo, widget: string, required: false }, { label: "Enlace (Drive)", name: url, widget: string }] }
          - label: "Otros temas"
            name: otros
            widget: list
            fields:
              - { label: "Nombre", name: nombre, widget: string }
              - { label: "Descripción", name: descripcion, widget: string }
              - { label: "Ícono", name: icono, widget: string }
              - { label: "Carpeta (Drive)", name: url, widget: string, required: false }
              - { label: "Documentos", name: documentos, widget: list, required: false, fields: [{ label: "Título", name: titulo, widget: string }, { label: "Código", name: codigo, widget: string, required: false }, { label: "Enlace (Drive)", name: url, widget: string }] }

      - label: "Trabaja con Nosotros"
        name: "trabaja"
        file: "_data/trabaja.json"
        fields:
          - { label: "Introducción", name: intro, widget: text }
          - { label: "Información general", name: body, widget: markdown }
          - { label: "Cómo postular", name: como_postular, widget: markdown }
          - { label: "Contacto Recursos Humanos", name: contacto_rrhh, widget: text }

      - label: "Campañas de salud (portada)"
        name: "campanas"
        file: "_data/campanas.json"
        fields:
          - label: "Banner rotativo (campañas estacionales)"
            name: rotativo
            widget: list
            hint: "Rota cada 8 segundos. Cada lámina se muestra solo en los meses indicados (vacío = todo el año)."
            fields:
              - { label: "Id", name: id, widget: string }
              - { label: "Meses en que se muestra (1 = enero … 12 = diciembre)", name: meses, widget: list, required: false, field: { label: "Mes", name: mes, widget: number, min: 1, max: 12, value_type: int } }
              - { label: "Color", name: estilo, widget: select, options: ["amarillo", "naranjo", "azul", "institucional", "rojo", "verde", "lago", "gris", "cafe"] }
              - { label: "Temporada / fuente", name: temporada, widget: string }
              - { label: "Título", name: titulo, widget: string }
              - { label: "Texto", name: texto, widget: text }
              - label: "Consejos (hasta 3)"
                name: consejos
                widget: list
                required: false
                fields:
                  - { label: "Dibujo", name: arte, widget: select, options: ["hanta", "sol", "pulmon", "casa", "vacuna", "ventilar", "frasco", "carpa", "agua", "gorro", "manos", "sarampion", "oncologia", "conversacion", "lazo", "donacion", "tabaco", "marea", "olla", "telefono", "lago", "salvavidas", "estufa", "sello", "cerdo", "hojas", "ropa", "termometro"] }
                  - { label: "Texto", name: texto, widget: string }
              - { label: "Enlace", name: url, widget: string }
              - { label: "Texto del botón", name: boton, widget: string }
              - { label: "Dibujo principal", name: arte, widget: select, options: ["hanta", "sol", "pulmon", "casa", "vacuna", "ventilar", "frasco", "carpa", "agua", "gorro", "manos", "sarampion", "oncologia", "conversacion", "lazo", "donacion", "tabaco", "marea", "olla", "telefono", "lago", "salvavidas", "estufa", "sello", "cerdo", "hojas", "ropa", "termometro"] }
          - label: "Campañas"
            name: campanas
            widget: list
            fields:
              - { label: "Titular", name: titular, widget: string }
              - { label: "Dato destacado (opcional, ej. *4141)", name: dato, widget: string, required: false }
              - { label: "Texto breve", name: texto, widget: string }
              - { label: "Enlace", name: url, widget: string }
              - { label: "Color (hex)", name: color, widget: color }
              - { label: "Dibujo", name: arte, widget: select, options: ["vacuna", "sarampion", "oncologia", "conversacion", "lazo", "donacion", "tabaco", "hanta"] }
              - { label: "Banner oficial (opcional; reemplaza el dibujo)", name: imagen, widget: image, required: false }
              - { label: "Más grande (destacada)", name: destacada, widget: boolean, default: false }

# Las noticias del sitio se publican desde el Portal Funcionarios (rol Comunicaciones o Administrador).
